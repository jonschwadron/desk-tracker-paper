<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desk blotter · XAUUSD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="sheet">
    <header>
      <p class="kicker">XAUUSD · gold only</p>
      <h1>Desk blotter</h1>
      <p class="lede">Coinexx demo 5217539 · Jonathan Schwadron</p>
    </header>

    <section class="card">
      <h2 id="card-status">—</h2>
      <p id="card-reason"></p>
      <p class="age" id="card-age"></p>
    </section>

    <section class="figures" id="figures"></section>

    <section class="ticket" id="ticket"></section>

    <section class="zones" id="zones"></section>

    <section class="fvg" id="fvg"></section>

    <figure class="picture" id="picture"></figure>

    <section class="feed-block">
      <h3>Activity</h3>
      <p class="age" id="feed-age"></p>
      <ol id="feed" class="feed"></ol>
    </section>

    <footer>
      <p id="asof"></p>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
